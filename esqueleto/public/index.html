<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador Hub IA</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 1fr 360px; height: 100vh; background: #efeae2; }
  #chat { display: flex; flex-direction: column; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .b { max-width: 70%; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; box-shadow: 0 1px 1px #0002; }
  .user { align-self: flex-end; background: #d9fdd3; }
  .assistant { align-self: flex-start; background: #fff; }
  .event { align-self: center; background: #fff3c4; font-size: 12px; max-width: 90%; }
  form { display: flex; gap: 8px; padding: 10px; background: #f0f2f5; }
  input[type=text] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  aside { background: #fff; border-left: 1px solid #ddd; padding: 12px; overflow-y: auto; font-size: 13px; }
  pre { background: #f6f6f6; padding: 8px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div id="chat">
  <div id="msgs"></div>
  <form id="f">
    <input type="text" id="t" placeholder="Escreva como se fosse o lead..." autocomplete="off">
    <button>Enviar</button>
    <button type="button" id="reset">Reiniciar</button>
  </form>
</div>
<aside>
  <label>Telefone (DDD) <input id="phone" value="5511999999999"></label>
  <h3>Estado</h3><pre id="state"></pre>
  <h3>Dados coletados</h3><pre id="fields"></pre>
  <h3>Chamadas LLM</h3><div id="logs"></div>
</aside>
<script>
let session;
const $ = (id) => document.getElementById(id);
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  return r.json();
}
function render() {
  $('msgs').innerHTML = '';
  for (const m of session.messages) {
    const d = document.createElement('div');
    d.className = 'b ' + m.role;
    d.textContent = m.event ? `[${m.event.kind}] ${m.event.message ?? m.event.summary ?? m.event.reason ?? ''}${m.event.classification ? ' · ' + m.event.classification : ''}` : (m.type === 'reaction' ? `reagiu ${m.body}` : m.body);
    $('msgs').appendChild(d);
  }
  $('msgs').scrollTop = 1e9;
  $('state').textContent = JSON.stringify(session.state, null, 2);
  $('fields').textContent = JSON.stringify(session.customFields, null, 2);
  $('logs').innerHTML = session.logs.map((l) => `<details><summary>${l.step} · ${l.model}</summary><pre>${l.systemPrompt.replace(/</g, '&lt;')}</pre></details>`).join('');
}
async function start() { session = await api('/api/sessions', { phone: $('phone').value }); render(); }
$('f').onsubmit = async (e) => {
  e.preventDefault();
  const body = $('t').value.trim(); if (!body) return;
  $('t').value = '';
  session.messages.push({ role: 'user', body }); render();
  session = await api(`/api/sessions/${session.id}/messages`, { type: 'text', body }); render();
};
$('reset').onclick = async () => { session = await api(`/api/sessions/${session.id}/reset`, {}); render(); };
start();
</script>
</body>
</html>
