# Deploy no Easypanel (serviço Compose, fonte Git).
# Sem portas publicadas no host: o domínio do Easypanel aponta para app:3000.
# Variáveis (aba Environment do serviço): TOGETHER_API_KEY, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD.

services:
  app:
    build:
      context: .
      dockerfile: esqueleto/Dockerfile
    expose:
      - "3000"
    environment:
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      MONGO_URL: mongodb://mongo:27017/hub_ia
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: hub-ia
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # mesma imagem do minio-*.tar local, reconstruída das camadas (tag saiu do Docker Hub)
    build:
      context: ./infra/minio
    image: hub-ia-minio:RELEASE.2025-02-03T21-03-04Z-cpuv1
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  minio-data:
