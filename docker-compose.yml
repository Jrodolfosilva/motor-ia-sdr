# Hub IA: motor + simulador com MongoDB, Redis e MinIO.
#   docker load -i minio-RELEASE.2025-02-03T21-03-04Z-cpuv1.tar   # 1ª vez (imagem do MinIO local)
#   docker compose up -d --build
#   App:            http://localhost:3000
#   MinIO console:  http://localhost:9001  (minioadmin / minioadmin)
# Só a infra (para rodar `npm run dev` fora do Docker): docker compose up -d mongo redis minio

name: hub-ia

services:
  app:
    build:
      context: .
      dockerfile: esqueleto/Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: ./esqueleto/.env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017/hub_ia
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: hub-ia
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 6380 no host: a 6379 já é usada por outro projeto nesta máquina
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z-cpuv1
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  minio-data:
